<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reSpeaker 实时双语字幕</title>
<style>
:root{
  --glass: rgba(255,255,255,.06);
  --glass-strong: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.14);
  --text: rgba(238,242,247,.92);
  --text-dim: rgba(238,242,247,.45);
  --accent: #4cc9f0;
  --accent-2: #7b6cf6;
  --ok: #34d399; --err: #f87171; --info: #60a5fa;
  --bg: #0a0f1e;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 15% 10%, rgba(76,201,240,.14), transparent 60%),
    radial-gradient(50rem 36rem at 85% 45%, rgba(123,108,246,.12), transparent 60%),
    radial-gradient(46rem 30rem at 50% 100%, rgba(251,146,60,.07), transparent 65%);

  display:flex;flex-direction:column;overflow:hidden;
}

header{
  position:relative;z-index:5;display:flex;align-items:center;gap:.7rem;
  padding:.8rem 1.1rem;
  background:rgba(13,18,33,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo{width:26px;height:26px;border-radius:50%;box-sizing:border-box;
  border:2px solid var(--accent);
  animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(.96)}
  50%{opacity:1;transform:scale(1.04)}}
header h1{font-size:1rem;font-weight:600;letter-spacing:.02em}
.spacer{flex:1}
#dot{width:9px;height:9px;border-radius:50%;background:#64748b;transition:background .3s;
  box-shadow:0 0 10px transparent}
#dot.on{background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
/* Voice-activity meter: four bars driven by the hardware speech flag. */
#gate{display:flex;align-items:flex-end;gap:2.5px;height:16px;opacity:.3;
  transition:opacity .35s ease;min-width:2.4em}
#gate i{width:3px;height:5px;border-radius:2px;background:var(--text-dim);
  transition:background .35s ease}
#gate.on i{background:var(--accent);animation:eq .9s ease-in-out infinite}
#gate.on i:nth-child(2){animation-delay:.13s}
#gate.on i:nth-child(3){animation-delay:.26s}
#gate.on i:nth-child(4){animation-delay:.39s}
@keyframes eq{0%,100%{height:5px}50%{height:15px}}
#gear{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;
  background:var(--glass);color:var(--text);cursor:pointer;display:grid;place-items:center;
  transition:transform .35s ease, background .2s}
#gear:hover{transform:rotate(45deg);background:var(--glass-strong)}
#gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}

main{max-width:1500px;margin:0 auto;width:100%;flex:1;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;
  padding:1.1rem clamp(1rem,3vw,3rem) 4.5rem;
  display:flex;flex-direction:column;gap:.75rem}

#legend{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;
  gap:.4rem;font-size:.68rem;margin-bottom:.1rem}
#legend span{display:inline-flex;align-items:center;gap:.35em;max-width:min(48%,30rem);
  padding:.2rem .6rem;border-radius:99px;border:1px solid var(--border);
  background:rgba(10,15,30,.74);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#legend .lgh{width:6px;height:6px;border-radius:50%;background:currentColor;
  flex:0 0 auto}
#legend .left{color:#c4b5fd}
#legend .right{color:var(--accent)}
#empty{display:flex;flex-direction:column;align-items:center;gap:1.35rem;
  padding:4rem 0;color:var(--text-dim)}

#empty .ring{position:relative;width:76px;height:76px;border-radius:50%;
  box-sizing:border-box;border:2px solid rgba(76,201,240,.6);
  animation:ring-breathe 3.8s ease-in-out infinite}
#empty .ring::before,#empty .ring::after{content:"";position:absolute;
  inset:-2px;border-radius:50%;border:1px solid rgba(76,201,240,.38);
  animation:ring-ripple 3.8s ease-out infinite}
#empty .ring::after{animation-delay:1.9s}
@keyframes ring-breathe{
  0%,100%{transform:scale(.88);opacity:.45;
    box-shadow:0 0 0 0 rgba(76,201,240,0),inset 0 0 0 0 rgba(76,201,240,0)}
  50%{transform:scale(1.06);opacity:1;
    box-shadow:0 0 22px 2px rgba(76,201,240,.22),
      inset 0 0 14px 1px rgba(76,201,240,.16)}
}
@keyframes ring-ripple{
  0%{transform:scale(1);opacity:.45}
  100%{transform:scale(1.75);opacity:0}
}
@media(prefers-reduced-motion:reduce){
  #empty .ring,#empty .ring::before,#empty .ring::after{
    animation-duration:6s}
}

.turn{position:relative;display:flex;align-items:flex-start;gap:.55rem;
  animation:rise .35s ease both}

.turn.right{justify-content:flex-end}
.turn.left{flex-direction:row-reverse;justify-content:flex-end}

.turn.left.cont,.turn.right.cont{margin-top:-.35rem}

.turn.cont .who{visibility:hidden}
.who{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;
  place-items:center;font-size:.6rem;font-weight:600;letter-spacing:.02em;
  font-family:ui-monospace,Consolas,monospace;margin-top:.15rem;
  border:1px solid var(--border);background:rgba(255,255,255,.05);
  color:var(--text-dim)}
.turn.right .who{color:var(--accent);background:rgba(76,201,240,.11);
  border-color:rgba(76,201,240,.35)}
.turn.left .who{color:#c4b5fd;background:rgba(167,139,250,.12);
  border-color:rgba(167,139,250,.35)}
.bubble{position:relative;max-width:min(76%,44rem);min-width:5.5rem;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:14px;padding:.7rem .9rem .75rem}
@supports not (backdrop-filter:blur(1px)){.bubble{background:rgba(20,26,44,.85)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.turn.right .bubble{border-bottom-right-radius:4px;
  border-color:rgba(76,201,240,.30);
  background:linear-gradient(135deg,rgba(76,201,240,.15),rgba(76,201,240,.05))}
.turn.left .bubble{border-bottom-left-radius:4px;
  border-color:rgba(123,108,246,.32);
  background:linear-gradient(135deg,rgba(123,108,246,.17),rgba(123,108,246,.06))}
.meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap}
.pill{font-size:.68rem;padding:.14rem .55rem;border-radius:99px;color:var(--accent);
  background:rgba(76,201,240,.10);border:1px solid rgba(76,201,240,.28);
  white-space:nowrap}
.pill.src{color:var(--text-dim);background:rgba(255,255,255,.05);
  border-color:var(--border)}
.turn.right .pill.src{color:var(--accent);background:rgba(76,201,240,.12);
  border-color:rgba(76,201,240,.32)}
.turn.left .pill.src{color:#c4b5fd;background:rgba(167,139,250,.13);
  border-color:rgba(167,139,250,.34)}

.pill.doa{color:#34d399;background:rgba(52,211,153,.09);
  border-color:rgba(52,211,153,.28);display:inline-flex;align-items:center;
  gap:.3em}
.pill.doa::before{content:"";width:5px;height:5px;border-radius:50%;
  background:currentColor;box-shadow:0 0 6px currentColor}
.src-text{font-size:1.02rem;line-height:1.55}

.trans{margin-top:.5rem;padding:.42rem .55rem;border-radius:9px;
  font-size:.95rem;line-height:1.5;color:var(--text);
  background:rgba(0,0,0,.20)}
.trans:empty{display:none}
.trans.pending{color:var(--text-dim);animation:shimmer 1.6s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:.95}}
.cursor{display:inline-block;width:.55em;height:1.05em;margin-left:.15em;
  vertical-align:-0.15em;background:var(--accent);
  animation:blink 1s steps(1) infinite;border-radius:2px}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

[hidden]{display:none !important}

#mask{position:fixed;inset:0;background:rgba(6,9,18,.45);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#mask.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:9;
  background:rgba(15,20,36,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-left:1px solid var(--border);transform:translateX(102%);transition:transform .32s ease;
  overflow-y:auto;padding:1.2rem 1.1rem 2rem}
#drawer.show{transform:none}
#drawer h2{font-size:1rem;font-weight:600;letter-spacing:.01em}
#drawer .sub{font-size:.72rem;color:var(--text-dim);margin-bottom:.2rem}
.section{margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--border)}
.section:first-of-type{border-top:0;padding-top:0}
.section h3{font-size:.74rem;color:var(--text-dim);margin-bottom:.65rem;display:flex;
  align-items:center;gap:.45rem;text-transform:uppercase;letter-spacing:.09em}

.field{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.field label{flex:0 0 5.4em;font-size:.74rem;color:var(--text-dim)}
.field select{margin:0;flex:1;color-scheme:dark}
select,input[type=text],input[type=number]{
  width:100%;padding:.5rem .6rem;margin-bottom:.55rem;border-radius:9px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--border);outline:none;font-size:.85rem;
  transition:border-color .2s, background .2s;
}

select option{background:var(--bg);color:var(--text)}
select option:checked{background:var(--bg);color:var(--accent)}
select:hover,input[type=text]:hover,input[type=number]:hover{border-color:rgba(255,255,255,.28)}
select:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--accent)}
.btn{padding:.55rem 1rem;border:none;border-radius:9px;cursor:pointer;font-size:.83rem;
  font-weight:600;color:#06121f;background:linear-gradient(135deg,var(--accent),#5eead4);
  transition:filter .2s, transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--glass-strong);color:var(--text);border:1px solid var(--border)}

.section .actions{display:flex;justify-content:flex-end;gap:.45rem;margin-top:.7rem}
.section .actions .btn{padding:.42rem .95rem;font-size:.76rem}

.zrow{display:grid;grid-template-columns:1.2em 1fr 3.6em 3.6em 30px;
  gap:.35rem;align-items:center;margin-bottom:.4rem}
.zrow .zlabel{min-width:0}
.zrow input{width:100%;margin:0;padding:.34rem .4rem;border-radius:7px;
  font-size:.72rem}
.zrow input[type=text]{text-align:left;font-family:inherit}
.zrow input[type=number]{text-align:right;font-family:ui-monospace,Consolas,monospace;
  -moz-appearance:textfield;appearance:textfield;color-scheme:dark}

.zrow input[type=number]::-webkit-outer-spin-button,
.zrow input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.del{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--border);border-radius:8px;
  background:transparent;color:var(--text-dim);cursor:pointer;display:grid;place-items:center;
  transition:all .2s}
.del:hover{color:var(--err);border-color:rgba(248,113,113,.4)}
.mini{padding:.28rem .55rem;border:none;border-radius:6px;cursor:pointer;font-size:.66rem;
  background:rgba(255,255,255,.1);color:var(--text);transition:background .2s}
.mini:hover{background:rgba(255,255,255,.2)}
.mini.icon{width:24px;padding:.28rem 0;display:grid;place-items:center;font-size:.8rem;
  line-height:1}

#toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,1rem);
  z-index:12;max-width:78vw;padding:.6rem 1.1rem;border-radius:10px;font-size:.82rem;
  background:rgba(15,20,36,.95);border:1px solid var(--border);color:var(--text);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease, visibility .25s;
  backdrop-filter:blur(10px)}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(52,211,153,.5)} #toast.err{border-color:rgba(248,113,113,.5)}
#toast.info{border-color:rgba(96,165,250,.5)}
@media(max-width:520px){
  main{padding:.9rem .8rem 4.5rem}
  .bubble{max-width:72%}
  .who{width:24px;height:24px;font-size:.54rem}
  #drawer{width:94vw}
}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>reSpeaker 实时双语字幕</h1>
  <div class="spacer"></div>
  <div id="gate" title="语音活动"><i></i><i></i><i></i><i></i></div>
  <div id="dot" title="连接状态"></div>
  <button id="gear" title="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/>
    <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/>
    </svg>
  </button>
</header>
<main id="stream">
  <div id="legend">
    <span class="left" id="lgLeft"><i class="lgh"></i>外文 → 中文</span>
    <span class="right" id="lgRight"><i class="lgh"></i>中文 → English</span>
  </div>
  <div id="empty"><div class="ring"></div>等待说话……</div>
</main>
<div id="mask"></div>
<aside id="drawer">
  <h2>设置</h2>
  <div class="sub">运行时配置立即生效</div>

  <div class="section">
    <h3>翻译方向</h3>
    <div class="field">
      <label for="zhTo">中文 →</label>
      <select id="zhTo"></select>
    </div>
    <div class="field">
      <label for="otherTo">其他语言 →</label>
      <select id="otherTo"></select>
    </div>
    <div class="sub">源语言按字幕文本判定：含假名→日语，含谚文→韩语，
      含汉字→中文，其余归为英语；识别不到的按“其他语言”处理。</div>
    <div class="actions"><button class="btn" id="saveLangs">保存方向</button></div>
  </div>

  <div class="section">
    <h3>DOA 方位标签
      <button class="mini icon" id="addZone" title="新增方位">＋</button>
    </h3>
    <div id="zones"></div>
    <div class="actions"><button class="btn ghost" id="saveZones">保存标签</button></div>
  </div>
</aside>
<div id="toast"></div>
<script>
"use strict";
let ws = null, reconnectDelay = 500;
const $ = id => document.getElementById(id);
const stream = $("stream"), empty = $("empty");
const cards = new Map();          // id -> turn element
const MAX_CARDS = 50;
let langLabels = {};
let targets = {zh_to: "en", other_to: "zh"};

function guessSide(text){
  if (/[\u3040-\u30ff\u31f0-\u31ff]/.test(text)) return "left";
  if (/[\uac00-\ud7af\u1100-\u11ff]/.test(text)) return "left";
  if (/[\u4e00-\u9fff\u3400-\u4dbf]/.test(text)) return "right";
  return "left";
}
function setSide(el, side){
  el.classList.toggle("right", side === "right");
  el.classList.toggle("left", side !== "right");
  const b = el.querySelector(".who");
  if (b) b.textContent = side === "right" ? "中" : "外";
  refreshRuns();
}
function refreshRuns(){
  let prev = null;
  for (const t of stream.querySelectorAll(".turn")){
    const side = t.classList.contains("right") ? "right" : "left";
    t.classList.toggle("cont", prev === side);
    prev = side;
  }
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg, kind){
  const t = $("toast");
  t.textContent = msg;
  t.className = "show " + (kind || "info");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = "", 2600);
}
function nearBottom(){
  return stream.scrollHeight - stream.scrollTop - stream.clientHeight <= 80;
}
function scrollIfStuck(){
  if (!nearBottom()) return;
  const gap = stream.scrollHeight - stream.scrollTop - stream.clientHeight;
  stream.scrollTo({top: stream.scrollHeight,
                   behavior: gap > 24 ? "smooth" : "auto"});
}
function removeEmpty(){
  if (empty && empty.parentNode) empty.remove();
}
function cardFor(id, partial){
    let el = cards.get(id);
  if (!el){
    el = document.createElement("div");
    el.className = "turn left";
    el.innerHTML =
      '<div class="bubble">' +
        '<div class="meta">' +
          '<span class="pill src">partial</span>' +
          '<span class="pill doa" hidden></span>' +
        '</div>' +
        '<div class="src-text"></div>' +
        (partial ? '<span class="cursor"></span>' : '') +
        '<div class="trans"></div>' +
      '</div>' +
      '<span class="who"></span>';
    stream.appendChild(el);
    cards.set(id, el);
    if (cards.size > MAX_CARDS){
      const oldest = cards.keys().next().value;
      cards.get(oldest).remove();
      cards.delete(oldest);
      refreshRuns();
    }
  }
  return el;
}

function stampDoa(el, doa){
  const p = el.querySelector(".pill.doa");
  if (!p) return;
  if (!doa){ p.hidden = true; return; }
  p.textContent = "方位 " + doa;
  p.title = "说话人方位：" + doa;
  p.hidden = false;
}
function freezeCard(el, lang){
  const cur = el.querySelector(".cursor");
  if (cur) cur.remove();
  const trans = el.querySelector(".trans");
  if (trans && !trans.textContent){
    trans.className = "trans pending";
    trans.textContent = "翻译中…";
  }
  setSide(el, lang === "zh" ? "right" : "left");
  const tgt = lang === "zh" ? targets.zh_to : targets.other_to;
  const pill = el.querySelector(".pill.src");
  pill.textContent = langName(lang) + " → " + langName(tgt);
  pill.className = "pill src";
}

function handle(msg){
  switch (msg.type){
    case "source": {
      removeEmpty();
      const el = cardFor(msg.id);
      freezeCard(el, msg.lang);
      stampDoa(el, msg.doa);
      el.querySelector(".src-text").textContent = msg.text || "";
      scrollIfStuck();
      break;
    }
    case "final": {
      removeEmpty();
      const el = cardFor(msg.id);
      freezeCard(el, msg.lang);
      stampDoa(el, msg.doa);
      el.querySelector(".src-text").textContent = msg.text || "";
      scrollIfStuck();
      break;
    }
    case "partial": {
      removeEmpty();
      const el = cardFor(msg.id, true);
      el.querySelector(".src-text").textContent = msg.text || "";
      setSide(el, guessSide(msg.text || ""));
      scrollIfStuck();
      break;
    }
    case "discard": {
      const el = cards.get(msg.id);
      if (el){ el.remove(); cards.delete(msg.id); refreshRuns(); }
      if (!cards.size) stream.appendChild(empty);
      break;
    }
    case "translation": {
      const el = cards.get(msg.id);
      if (el){
        const t = el.querySelector(".trans");
        t.className = "trans";
        t.textContent = msg.text || "";
      }
      scrollIfStuck();
      break;
    }
    case "vad.state": {
      const g = $("gate");
      const active = msg.segment_state === "SPEAKING" || !!msg.hw_vad;
      g.classList.toggle("on", active);
      g.title = "语音活动：" + (active ? "说话中" : "静音") +
        "（门控 " + (msg.gate_mode || "?") + "）";
      break;
    }
    case "cmd_result":
      if (msg.ok === false) toast("命令失败: " + (msg.error || ""), "err");
      break;
  }
}

function sendCmd(cmd, payload){
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({cmd, payload}));
}

function langName(code){
  return langLabels[code] || code || "?";
}
function paintLegend(){
  $("lgRight").innerHTML = '<i class="lgh"></i>' +
    esc("中文 → " + langName(targets.zh_to));
  $("lgLeft").innerHTML = '<i class="lgh"></i>' +
    esc("外文 → " + langName(targets.other_to));
}
function renderTargets(data){
  const opts = data.options || {};
  for (const [sel, val] of [["zhTo", data.zh_to], ["otherTo", data.other_to]]){
    const el = $(sel);
    el.innerHTML = Object.entries(opts).map(([code, label]) =>
      '<option value="' + esc(code) + '"' + (code === val ? " selected" : "") +
      ">" + esc(label) + "</option>").join("");
  }
  langLabels = opts;
  targets = {zh_to: data.zh_to, other_to: data.other_to};
  paintLegend();
}
function zoneRow(z, index){
  const div = document.createElement("div");
  div.className = "zrow";
  div.innerHTML =
    '<span class="idx">' + (index || 1) + "</span>" +
    '<input type="text" class="zlabel" value="' + esc(z.label) + '" placeholder="标签">' +
    '<input type="number" class="zstart" min="0" max="359" step="1" value="' + z.start +
      '" title="起点角度，0° = 阵列正前方，顺时针">' +
    '<input type="number" class="zend" min="0" max="359" step="1" value="' + z.end +
      '" title="终点角度，可小于起点表示跨越 360°">' +
    '<button class="del" title="删除">✕</button>';
  div.querySelector(".del").onclick = () => { div.remove(); renumberZones(); };
  return div;
}
function renumberZones(){
  [...document.querySelectorAll("#zones .zrow .idx")]
    .forEach((s, i) => { s.textContent = i + 1; });
}
function readZones(){
  return [...document.querySelectorAll("#zones .zrow")].map(r => ({
    label: r.querySelector(".zlabel").value.trim(),
    start: parseFloat(r.querySelector(".zstart").value) || 0,
    end: parseFloat(r.querySelector(".zend").value) || 0
  })).filter(z => z.label);
}
function renderZones(data){
  const box = $("zones");
  box.innerHTML = "";
  const zones = (data.zones || []).map(z =>
    (typeof z === "object" && z !== null)
      ? {label: String(z.label ?? ""), start: Number(z.start) || 0, end: Number(z.end) || 0}
      : {label: String(z), start: 0, end: 0});
  if (zones.length && zones.every(z => z.start === 0 && z.end === 0)){
    const step = 360 / zones.length;
    zones.forEach((z, i) => {
      z.start = Math.round(i * step);
      z.end = Math.round((i + 1) * step);
    });
  }
  zones.forEach((z, i) => box.appendChild(zoneRow(z, i + 1)));
}

function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/ws");
  ws.onopen = () => {
    $("dot").classList.add("on");
    reconnectDelay = 500;
    sendCmd("get_target_langs");
    sendCmd("get_zones");
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch(err){ return; }
    if (m.type === "cmd_result"){
      if (m.data && m.data.options) renderTargets(m.data);
      if (m.data && m.data.zones) renderZones(m.data);
      return;
    }
    handle(m);
  };
  ws.onclose = () => {
    $("dot").classList.remove("on");
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.6, 8000);
  };
  ws.onerror = () => ws.close();
}

const drawer = $("drawer"), mask = $("mask");
function openDrawer(){ drawer.classList.add("show"); mask.classList.add("show"); }
function closeDrawer(){ drawer.classList.remove("show"); mask.classList.remove("show"); }
$("gear").onclick = () => drawer.classList.contains("show") ? closeDrawer() : openDrawer();
mask.onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function commitLangs(){
  targets = {zh_to: $("zhTo").value, other_to: $("otherTo").value};
  paintLegend();
  sendCmd("set_target_langs", targets);
}
$("zhTo").onchange = commitLangs;
$("otherTo").onchange = commitLangs;
$("saveLangs").onclick = () => {
  commitLangs();
  toast("翻译方向已保存", "ok");
};
$("addZone").onclick = () => {
  const n = document.querySelectorAll("#zones .zrow").length;
  $("zones").appendChild(zoneRow({label: "", start: 0, end: 0}, n + 1));
};
$("saveZones").onclick = () => {
  const zones = readZones();
  if (!zones.length){ toast("至少需要一个方位标签", "err"); return; }
  sendCmd("set_zones", {zones});
  toast("方位标签已保存", "ok");
};

connect();
</script>
</body>
